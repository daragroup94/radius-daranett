# ============================================
# FREERADIUS PROJECT - DOCKER COMPOSE
# Complete FreeRADIUS with Dashboard & PostgreSQL
# ============================================

# Secrets dikelola di file .env (jangan commit ke git)

services:
  # ==========================================
  # RADIUS DASHBOARD (Flask Application)
  # ==========================================
  radius-dashboard:
    build: .
    container_name: radius-dashboard
    restart: unless-stopped
    # Traefik Labels
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radius.entrypoints=web"
      - "traefik.http.routers.radius.rule=Host(`radius.go.daragroup.cloud`) || Host(`radius.access.daragroup.cloud`)"
      - "traefik.http.routers.radius.middlewares=radius-https-redirect"
      - "traefik.http.middlewares.radius-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.radius-https-redirect.redirectscheme.permanent=true"
      # IPoE Domain Router (Bypass HTTPS Redirect for /api/ipoe/ paths)
      - "traefik.http.routers.radius-ipoe.entrypoints=web"
      - "traefik.http.routers.radius-ipoe.rule=(Host(`radius.go.daragroup.cloud`) || Host(`radius.access.daragroup.cloud`)) && PathPrefix(`/api/ipoe/`)"
      - "traefik.http.routers.radius-ipoe.service=radius-service"
      # IPoE Raw IP Router (For RouterOS v6 compatibility where URL overrides host header)
      - "traefik.http.routers.radius-ipoe-ip.entrypoints=web"
      - "traefik.http.routers.radius-ipoe-ip.rule=(Host(`10.100.0.1`) || Host(`10.30.0.1`) || Host(`10.50.0.1`)) && PathPrefix(`/api/ipoe/`)"
      - "traefik.http.routers.radius-ipoe-ip.service=radius-service"
      # HTTPS (Secure)
      - "traefik.http.routers.radius-secure.entrypoints=websecure"
      - "traefik.http.routers.radius-secure.rule=Host(`radius.go.daragroup.cloud`) || Host(`radius.access.daragroup.cloud`)"
      - "traefik.http.routers.radius-secure.tls=true"
      - "traefik.http.routers.radius-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.radius-secure.service=radius-service"
      # Service Configuration
      - "traefik.http.services.radius-service.loadbalancer.server.port=5000"
    # Environment Variables (dari .env)
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - REDIS_URL=${REDIS_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - FLASK_ENV=${FLASK_ENV}
      - TZ=${TZ}
      - EVENTLET_NO_GREENDNS=yes
      - PYTHONUNBUFFERED=1
    # Volumes
    volumes:
      - ./app:/app
      - ./uploads:/app/static/uploads
      - ./logs:/app/logs
      - ./backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/openvpn-status.log:/tmp/openvpn-status.log:ro
      - /etc/openvpn/ccd:/etc/openvpn/ccd
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/bin/radclient:/usr/bin/radclient:ro
    # Allow adding routes to reach NAS subnets
    cap_add:
      - NET_ADMIN
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Network
    networks:
      my-net:
        ipv4_address: 100.204.0.51
    # Dependencies
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Health Check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

      # ==========================================

  # POSTGRESQL DATABASE
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: freeradius-db
    restart: unless-stopped
    # Environment Variables
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      TZ: ${TZ}
    # Ports (Optional - comment if not needed)
#    ports:
#      - "5432:5432"
    # Volumes
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.db:/docker-entrypoint-initdb.d
    # Network
    networks:
      my-net:
        ipv4_address: 100.204.0.52
    # Health Check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radius -d radius"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================
  # REDIS CACHE
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: radius-redis
    restart: unless-stopped
    # Ports (Optional - comment if not needed)
    ports:
      - "6379:6379"

    # Volumes
    volumes:
      - redis_data:/data
    # Network
    networks:
      my-net:
        ipv4_address: 100.204.0.53
    # Command
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru --replicaof no one
    # Health Check
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==========================================
  # FREERADIUS SERVER
  # ==========================================
  freeradius:
    build:
      context: .
      dockerfile: Dockerfile-freeradius
    container_name: freeradius-server
    restart: unless-stopped
    # Environment Variables
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      TZ: ${TZ}
    # Ports
    ports:
      - "1812:1812/udp"    # Authentication PPPoE
      - "1813:1813/udp"    # Accounting PPPoE
      - "11812:11812/udp"  # Authentication IPoE
      - "11813:11813/udp"  # Accounting IPoE
      - "3799:3799/udp"    # CoA / Disconnect-Message
      - "21812:21812/udp"  # Authentication Hotspot
      - "21813:21813/udp"  # Accounting Hotspot
      - "31812:31812/udp"  # Authentication VPN
      - "31813:31813/udp"  # Accounting VPN
      - "41812:41812/udp"  # Authentication Wireless
      - "41813:41813/udp"  # Accounting Wireless
    # Volumes
    volumes:
      - ./clients.conf:/etc/freeradius/3.0/clients.conf:ro
      - ./freeradius-config/mods-available/sql:/etc/freeradius/3.0/mods-available/sql:ro
      - ./freeradius-config/mods-available/sqlcounter:/etc/freeradius/3.0/mods-available/sqlcounter:ro
      - ./freeradius-config/mods-enabled/sqlcounter:/etc/freeradius/3.0/mods-enabled/sqlcounter:ro
      - ./freeradius-config/sites-enabled/default:/etc/freeradius/3.0/sites-enabled/default:ro
      - ./freeradius-config/sites-enabled/ipoe:/etc/freeradius/3.0/sites-enabled/ipoe:ro
      - ./freeradius-config/sites-enabled/hotspot:/etc/freeradius/3.0/sites-enabled/hotspot:ro
      - ./freeradius-config/sites-enabled/vpn:/etc/freeradius/3.0/sites-enabled/vpn:ro
      - ./freeradius-config/sites-enabled/wireless:/etc/freeradius/3.0/sites-enabled/wireless:ro
      - ./freeradius-config/sites-enabled/inner-tunnel:/etc/freeradius/3.0/sites-enabled/inner-tunnel:ro
      - ./app/freeradius-config/certs/server.pem:/etc/freeradius/3.0/certs/server.pem:ro
      - ./app/freeradius-config/certs/server.key:/etc/freeradius/3.0/certs/server.key:ro
      - ./freeradius-config/mods-available/eap:/etc/freeradius/3.0/mods-enabled/eap:ro
      - ./freeradius-config/mods-available/sql_hotspot:/etc/freeradius/3.0/mods-available/sql_hotspot:ro
      - ./freeradius-config/dictionary:/etc/freeradius/3.0/dictionary:ro
      - ./freeradius-logs:/var/log/freeradius
    # Network
    networks:
      my-net:
        ipv4_address: 100.204.0.54
    # Allow adding routes to VPN subnets via host gateway
    cap_add:
      - NET_ADMIN
    # Command (Debug mode)
    command: freeradius -f
    # Dependencies
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # PGADMIN (Database Management)
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: freeradius-pgadmin
    restart: unless-stopped
    # Traefik Labels
    labels:
      - "traefik.enable=true"
      # HTTP (Redirect to HTTPS)
      - "traefik.http.routers.pgadmin.entrypoints=web"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.go.daragroup.cloud`) || Host(`pgadmin.access.daragroup.cloud`)"
      - "traefik.http.routers.pgadmin.middlewares=pgadmin-https-redirect"
      - "traefik.http.middlewares.pgadmin-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.pgadmin-https-redirect.redirectscheme.permanent=true"
      # HTTPS (Secure)
      - "traefik.http.routers.pgadmin-secure.entrypoints=websecure"
      - "traefik.http.routers.pgadmin-secure.rule=Host(`pgadmin.go.daragroup.cloud`) || Host(`pgadmin.access.daragroup.cloud`)"
      - "traefik.http.routers.pgadmin-secure.tls=true"
      - "traefik.http.routers.pgadmin-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.pgadmin-secure.service=pgadmin-service"
      # Service Configuration
      - "traefik.http.services.pgadmin-service.loadbalancer.server.port=80"
    # Environment Variables
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      TZ: ${TZ}
    # Volumes
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    # Network
    networks:
      my-net:
        ipv4_address: 100.204.0.55
    # Dependencies
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # IKEv2 VPN SERVER (StrongSwan)
  # ==========================================
  ikev2-vpn:
    build:
      context: ./ikev2-config
      dockerfile: Dockerfile
    container_name: ikev2-vpn
    restart: unless-stopped
    # Privileged is required for IPsec kernel modules and routing
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      # Opsional: Jika kosong, script akan otomatis mendeteksi IP Public
      - VPN_DOMAIN_OR_IP=
    ports:
      - "500:500/udp"
      - "4500:4500/udp"
    volumes:
      - ./uploads:/app-certs
      - /lib/modules:/lib/modules:ro
      - ikev2_certs:/etc/ipsec.d
    networks:
      my-net:
        ipv4_address: 100.204.0.56
    depends_on:
      freeradius:
        condition: service_started

# ==========================================
# NETWORKS
# ==========================================
networks:
  my-net:
    external: true
    name: my-net

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_data:
    driver: local
    name: freeradius_postgres_data
  redis_data:
    driver: local
    name: freeradius_redis_data
  ikev2_certs:
    external: true
    name: ikev2_certs
  pgadmin_data:
    driver: local
    name: freeradius_pgadmin_data
