# --- PENGECUALIAN KHUSUS MONITORING KUMA VIA IP DOCKER ---
client uptime_kuma {
    ipaddr                          = 10.204.0.62
    secret                          = radiussecret
    shortname                       = kuma
    require_message_authenticator   = no
}

# Client untuk Mikrotik dan semua IP
client all {
    ipaddr = 0.0.0.0/0
    secret = radiussecret
    nastype = other
    require_message_authenticator = yes
    limit_proxy_state = auto
}
