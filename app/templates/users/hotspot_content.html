<div class="fade-in space-y-6">

    <!-- NOC Operations Header -->
    <div class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between bg-gradient-to-r from-slate-900 to-slate-800 dark:from-slate-950 dark:to-slate-900 p-6 rounded-3xl text-white shadow-xl relative overflow-hidden">
        <div class="absolute top-0 right-0 w-64 h-64 bg-amber-500/10 rounded-full blur-3xl -mr-16 -mt-16 pointer-events-none"></div>
        
        <div class="z-10 mb-4 md:mb-0 flex items-center">
            <div class="icon-wrapper-noc icon-gradient-hotspot mr-4 shadow-lg shadow-amber-500/15 floating-icon">
                <i data-lucide="ticket" class="lucide icon-noc text-white"></i>
            </div>
            <div>
                <h2 class="text-xl md:text-2xl font-extrabold tracking-tight bg-gradient-to-r from-white to-slate-200 bg-clip-text text-transparent">Voucher Hotspot</h2>
                <p class="text-slate-300 text-xs md:text-sm mt-0.5">Kelola, generate massal, cetak barcode QR, dan pantau status voucher hotspot pelanggan.</p>
            </div>
        </div>
        
        <div class="z-10 flex gap-2.5 flex-wrap">
            <button onclick="openCreateModal()" class="bg-slate-700 hover:bg-slate-600 border border-slate-600 text-white px-4 py-3 rounded-2xl flex items-center space-x-2 font-bold shadow-lg transition-all hover:scale-[1.02] whitespace-nowrap">
                <i data-lucide="plus" class="lucide w-5 h-5 text-white"></i>
                <span>Buat Manual</span>
            </button>
            <button onclick="openGenerateModal()" class="bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white px-5 py-3 rounded-2xl flex items-center space-x-2 font-bold shadow-lg shadow-amber-500/20 transition-all hover:scale-[1.02] whitespace-nowrap">
                <i data-lucide="plus-circle" class="lucide w-5 h-5 text-white"></i>
                <span>Generate Voucher</span>
            </button>
        </div>
    </div>

    <!-- Stats Cards Row -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-5">
        <!-- Total Voucher -->
        <div class="bg-white dark:bg-slate-800 border border-slate-150 dark:border-slate-700/80 rounded-3xl p-5 shadow-sm stat-card-glow flex items-center gap-4">
            <div class="icon-wrapper-noc icon-gradient-hotspot shadow-md shadow-amber-500/10">
                <i data-lucide="ticket" class="lucide icon-noc text-white"></i>
            </div>
            <div>
                <p class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Total Voucher</p>
                <p class="text-2xl font-extrabold text-slate-800 dark:text-white mt-1 font-outfit" id="statTotal">—</p>
            </div>
        </div>
        <!-- Active Vouchers -->
        <div class="bg-white dark:bg-slate-800 border border-slate-150 dark:border-slate-700/80 rounded-3xl p-5 shadow-sm stat-card-glow flex items-center gap-4">
            <div class="icon-wrapper-noc icon-gradient-nas shadow-md shadow-emerald-500/10">
                <i data-lucide="activity" class="lucide icon-noc text-white"></i>
            </div>
            <div>
                <p class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Aktif (Online)</p>
                <p class="text-2xl font-extrabold text-slate-800 dark:text-white mt-1 font-outfit" id="statActive">—</p>
            </div>
        </div>
        <!-- Unused Vouchers -->
        <div class="bg-white dark:bg-slate-800 border border-slate-150 dark:border-slate-700/80 rounded-3xl p-5 shadow-sm stat-card-glow flex items-center gap-4">
            <div class="icon-wrapper-noc bg-gradient-to-tr from-purple-500 to-indigo-600 shadow-md shadow-purple-500/10">
                <i data-lucide="clock" class="lucide icon-noc text-white"></i>
            </div>
            <div>
                <p class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Belum Dipakai</p>
                <p class="text-2xl font-extrabold text-slate-800 dark:text-white mt-1 font-outfit" id="statUnused">—</p>
            </div>
        </div>
        <!-- Expired Vouchers -->
        <div class="bg-white dark:bg-slate-800 border border-slate-150 dark:border-slate-700/80 rounded-3xl p-5 shadow-sm stat-card-glow flex items-center gap-4">
            <div class="icon-wrapper-noc bg-gradient-to-tr from-rose-500 to-red-600 shadow-md shadow-red-500/10">
                <i data-lucide="power" class="lucide icon-noc text-white"></i>
            </div>
            <div>
                <p class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Expired</p>
                <p class="text-2xl font-extrabold text-slate-800 dark:text-white mt-1 font-outfit" id="statExpired">—</p>
            </div>
        </div>
    </div>

    <!-- Main List Card Container -->
    <div class="bg-white dark:bg-slate-800 border border-slate-150 dark:border-slate-700/80 rounded-3xl p-6 shadow-sm">
        <!-- Sub-header dengan Search Bar & Domain Link -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4 border-b border-slate-100 dark:border-slate-750 pb-5">
            <div class="flex gap-2.5 flex-wrap items-center">
                <div class="relative">
                    <i data-lucide="search" class="lucide w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="searchInput" placeholder="Cari voucher / username..."
                        class="pl-9 pr-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-transparent text-slate-800 dark:text-slate-200 text-xs font-medium w-52 transition-all"
                        oninput="debounceLoad()">
                </div>
                <select id="filterStatus" onchange="loadVouchers()" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-600 dark:text-slate-300 focus:ring-2 focus:ring-amber-500">
                    <option value="">Semua Status</option>
                    <option value="unused">Belum Dipakai</option>
                    <option value="active">Aktif</option>
                    <option value="expired">Expired</option>
                </select>
                <!-- Hotspot Domain Settings (Saved in LocalStorage) -->
                <div class="flex items-center gap-1.5 border border-amber-100 dark:border-amber-900/30 rounded-xl px-3 py-2.5 bg-amber-50/30 dark:bg-amber-950/20">
                    <span class="text-[10px] text-amber-700 dark:text-amber-400 font-extrabold uppercase tracking-wider whitespace-nowrap"><i data-lucide="link" class="lucide w-3.5 h-3.5 inline mr-1"></i>Hotspot Link:</span>
                    <input type="text" id="hotspotDomain" placeholder="http://daranett.hs.com" 
                        class="border-none p-0 text-xs focus:ring-0 focus:outline-none bg-transparent w-36 font-mono font-bold text-amber-900 dark:text-amber-200"
                        onchange="saveHotspotDomain()">
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="openCreateModal()" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-700 hover:bg-slate-650 text-white shadow-md transition-all">
                    <i class="fas fa-plus mr-1"></i> Buat Manual
                </button>
                <button onclick="openGenerateModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-white shadow-md hover:opacity-90 transition-all bg-gradient-to-r from-amber-500 to-orange-600">
                    <i class="fas fa-plus mr-1"></i> Generate Voucher
                </button>
                <button onclick="deleteExpired()" class="px-4 py-2 rounded-xl text-sm font-medium text-white shadow-md hover:opacity-90 transition-all" style="background:linear-gradient(135deg,#ef4444,#dc2626)">
                    <i class="fas fa-trash mr-1"></i> Hapus Expired
                </button>
            </div>
        </div>
    </div>

    <!-- Vouchers Grid -->
    <div>
        <div id="voucherGrid" class="w-full">
            <!-- Content will be loaded dynamically here -->
            <div class="text-center py-20 text-gray-400 bg-white rounded-3xl border border-slate-150 p-6 shadow-sm"><i class="fas fa-spinner fa-spin text-3xl mb-4 text-amber-500"></i><p>Memuat...</p></div>
        </div>
        
        <!-- Pagination -->
        <div id="pagination" class="flex items-center justify-between px-5 py-4 border-t border-gray-100 bg-white rounded-2xl shadow mt-5"></div>
    </div>
</div>

<!-- QR Code Modal -->
<div id="qrModal" class="fixed inset-0 bg-black bg-opacity-40 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-base font-bold text-gray-800"><i class="fas fa-qrcode text-purple-500 mr-2"></i>Login QR Code</h3>
            <button onclick="closeQrModal()" class="w-8 h-8 bg-gray-100 hover:bg-red-100 text-gray-600 hover:text-red-600 rounded-lg transition-all flex items-center justify-center">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="bg-purple-50 p-4 rounded-2xl inline-block mb-3 border border-purple-100">
            <img id="qrImage" src="" alt="QR Code" class="w-48 h-48 mx-auto bg-white p-2 rounded-xl">
        </div>
        <p class="text-xs font-bold text-purple-700 mb-1">Scan untuk Login Otomatis</p>
        <p class="text-[10px] text-gray-400 font-mono break-all px-2 select-all" id="qrLinkText"></p>
        <div class="mt-4 flex gap-2">
            <button onclick="closeQrModal()" class="w-full py-2 bg-purple-600 text-white rounded-xl text-sm font-semibold hover:opacity-90">Tutup</button>
        </div>
    </div>
</div>

<script>
let _page = 1, _total = 0, _limit = 20, _debounce;

function debounceLoad() { clearTimeout(_debounce); _debounce = setTimeout(loadVouchers, 400); }

// Load hotspot domain on page load
document.addEventListener('DOMContentLoaded', () => {
    let savedDomain = localStorage.getItem('hotspot_domain');
    if (!savedDomain || savedDomain === 'http://10.5.50.1' || savedDomain === 'http://dara.hotspot') {
        savedDomain = 'http://daranett.hs.com';
        localStorage.setItem('hotspot_domain', savedDomain);
    }
    document.getElementById('hotspotDomain').value = savedDomain;
});

function saveHotspotDomain() {
    let domain = document.getElementById('hotspotDomain').value.trim();
    if (domain && !domain.startsWith('http://') && !domain.startsWith('https://')) {
        domain = 'http://' + domain;
    }
    document.getElementById('hotspotDomain').value = domain;
    localStorage.setItem('hotspot_domain', domain);
    loadVouchers(_page); // Reload to update share URLs
}

async function loadVouchers(page = 1) {
    _page = page;
    const search = document.getElementById('searchInput').value;
    const status = document.getElementById('filterStatus').value;
    const res = await fetch(`/api/hotspot/vouchers?page=${page}&limit=${_limit}&search=${encodeURIComponent(search)}&status=${status}`);
    const data = await res.json();
    _total = data.total;

    // Update stats
    const all = await fetch('/api/hotspot/vouchers?limit=1').then(r=>r.json());
    const active = await fetch('/api/hotspot/vouchers?limit=1&status=active').then(r=>r.json());
    const unused = await fetch('/api/hotspot/vouchers?limit=1&status=unused').then(r=>r.json());
    const expired = await fetch('/api/hotspot/vouchers?limit=1&status=expired').then(r=>r.json());
    document.getElementById('statTotal').textContent = all.total;
    document.getElementById('statActive').textContent = active.total;
    document.getElementById('statUnused').textContent = unused.total;
    document.getElementById('statExpired').textContent = expired.total;

    const grid = document.getElementById('voucherGrid');
    if (!data.vouchers?.length) {
        grid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-400 bg-white rounded-2xl border border-gray-100 p-6 shadow-sm"><i class="fas fa-ticket-alt text-5xl mb-4 opacity-30 text-purple-400"></i><p class="font-semibold text-gray-600">Tidak ada voucher ditemukan</p></div>';
        document.getElementById('pagination').innerHTML = '';
        return;
    }

    const hostDomain = document.getElementById('hotspotDomain').value.trim() || 'http://daranett.hs.com';

    grid.innerHTML = `
        <div class="overflow-x-auto min-w-full bg-white rounded-3xl border border-slate-150 p-4 shadow-sm">
            <table class="w-full text-left border-collapse align-middle">
                <thead>
                    <tr class="border-b border-slate-100 dark:border-slate-700/50 text-[10px] font-bold text-slate-400 dark:text-slate-550 uppercase tracking-wider">
                        <th class="pb-3 pt-1 px-4 font-extrabold">KODE / PAKET</th>
                        <th class="pb-3 pt-1 px-4 font-extrabold">KREDENSIAL</th>
                        <th class="pb-3 pt-1 px-4 font-extrabold">KECEPATAN</th>
                        <th class="pb-3 pt-1 px-4 font-extrabold">STATUS & MASA AKTIF</th>
                        <th class="pb-3 pt-1 px-4 font-extrabold text-right">AKSI</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-50 dark:divide-slate-750">
    ` + data.vouchers.map(v => {
        const statusBadge = {
            'unused': '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold bg-amber-50 text-amber-600 border border-amber-100">Belum Dipakai</span>',
            'active': '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-600 border border-emerald-100"><span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse mr-1"></span>Aktif</span>',
            'expired': '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold bg-rose-50 text-rose-600 border border-rose-100">Expired</span>',
        }[v.status] || '';

        const credentialsHtml = `
            <div class="flex flex-col gap-0.5">
                <span class="text-xs font-mono text-slate-700">U: <strong class="select-all">${v.username}</strong></span>
                <span class="text-xs font-mono text-slate-550">P: <strong class="select-all">${v.password}</strong></span>
            </div>
        `;

        let timeInfoHtml = '';
        if (v.first_login) {
            timeInfoHtml = `
                <div class="flex flex-col gap-0.5 text-[11px] text-slate-500">
                    <span>Mulai: ${fmtDate(v.first_login)}</span>
                    <span>Expired: ${fmtDate(v.expires_at)}</span>
                    ${v.status === 'active' ? `<span class="text-emerald-600 font-bold">Sisa: ${fmtSecs(v.remaining_seconds)}</span>` : ''}
                </div>
            `;
        } else {
            timeInfoHtml = '<span class="text-[11px] text-slate-400 italic">Belum digunakan</span>';
        }

        // Direct Login URL for QR & WhatsApp share
        const loginUrl = `${hostDomain}/login?username=${v.username}&password=${v.password}`;
        
        // Formatted text for WhatsApp Share
        const waText = encodeURIComponent(
            `*VOUCHER INTERNET HOTSPOT*\n` +
            `-----------------------------------------\n` +
            `• Paket: *${v.package_name}*\n` +
            `• Kode Voucher: *${v.voucher_code}*\n` +
            `• Username: \`${v.username}\`\n` +
            `• Password: \`${v.password}\`\n` +
            `• Kecepatan: *${v.rate_limit || 'Tidak Dibatasi'}*\n` +
            `-----------------------------------------\n` +
            `*Cara Penggunaan:*\n` +
            `1. Hubungkan Wi-Fi ke jaringan Hotspot.\n` +
            `2. Klik link login otomatis di bawah ini:\n` +
            `${loginUrl}`
        );

        return '<tr class="hover:bg-slate-50/50 transition-colors">'
            + '<td class="py-3 px-4">'
            + '<div class="flex items-center gap-3">'
            + '<div class="w-8 h-8 rounded-lg flex items-center justify-center bg-gradient-to-tr from-amber-500 to-orange-600 text-white shadow-sm flex-shrink-0"><i class="fas fa-ticket-alt text-xs text-white"></i></div>'
            + '<div class="flex flex-col">'
            + '<span class="font-black text-slate-800 text-sm tracking-wide font-mono">' + v.voucher_code + '</span>'
            + '<span class="text-[10px] font-extrabold text-amber-600 uppercase tracking-wider mt-0.5">' + v.package_name + '</span>'
            + '</div>'
            + '</div>'
            + '</td>'
            + '<td class="py-3 px-4">' + credentialsHtml + '</td>'
            + '<td class="py-3 px-4"><span class="text-xs font-mono text-indigo-650 bg-indigo-50/60 px-2 py-0.5 rounded border border-indigo-100/50"><i class="fas fa-tachometer-alt text-indigo-400 mr-1"></i>' + (v.rate_limit || 'Tidak Dibatasi') + '</span></td>'
            + '<td class="py-3 px-4">'
            + '<div class="flex flex-col gap-1">'
            + '<div>' + statusBadge + '</div>'
            + timeInfoHtml
            + '</div>'
            + '</td>'
            + '<td class="py-3 px-4 text-right">'
            + '<div class="flex gap-1.5 justify-end">'
            + '<button onclick="copyToClipboard(\'' + v.voucher_code + '\')" class="w-8 h-8 rounded-lg bg-slate-50 hover:bg-slate-200 border border-slate-200 text-slate-600 flex items-center justify-center transition-all shadow-sm" title="Salin Kode"><i class="far fa-copy text-xs"></i></button>'
            + '<button onclick="showQrModal(\'' + v.voucher_code + '\', \'' + loginUrl + '\')" class="w-8 h-8 bg-blue-50 hover:bg-blue-500 text-blue-600 hover:text-white rounded-lg flex items-center justify-center transition-all" title="QR Code"><i class="fas fa-qrcode text-xs"></i></button>'
            + '<a href="https://api.whatsapp.com/send?text=' + waText + '" target="_blank" class="w-8 h-8 bg-emerald-50 hover:bg-emerald-500 text-emerald-600 hover:text-white rounded-lg flex items-center justify-center transition-all" title="WhatsApp Share"><i class="fab fa-whatsapp text-xs"></i></a>'
            + '<button onclick="deleteVoucher(' + v.id + ')" class="w-8 h-8 bg-rose-50 hover:bg-rose-500 text-rose-600 hover:text-white rounded-lg flex items-center justify-center transition-all" title="Hapus"><i class="fas fa-trash text-xs"></i></button>'
            + '</div>'
            + '</td>'
            + '</tr>';
    }).join('') + `
                </tbody>
            </table>
        </div>
    `;

    // Pagination
    const totalPages = data.total_pages;
    document.getElementById('pagination').innerHTML = totalPages <= 1 ? `
        <span class="text-xs text-gray-500">Total: ${_total} voucher</span>` : `
        <span class="text-xs text-gray-500">Total: ${_total} voucher</span>
        <div class="flex gap-1">
            ${_page > 1 ? `<button onclick="loadVouchers(${_page-1})" class="px-3 py-1 rounded-lg text-xs bg-gray-100 hover:bg-gray-200">‹</button>` : ''}
            <span class="px-3 py-1 text-xs text-gray-600">${_page} / ${totalPages}</span>
            ${_page < totalPages ? `<button onclick="loadVouchers(${_page+1})" class="px-3 py-1 rounded-lg text-xs bg-gray-100 hover:bg-gray-200">›</button>` : ''}
        </div>`;
}

function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('id-ID', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

function fmtSecs(s) {
    if (!s) return '0 detik';
    const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60);
    return [d&&`${d}d`, h&&`${h}j`, m&&`${m}m`].filter(Boolean).join(' ') || '<1m';
}

function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => {
        showNotification('Kode voucher berhasil disalin!', 'success');
    }).catch(err => {
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        showNotification('Kode voucher berhasil disalin!', 'success');
    });
}

function showQrModal(code, url) {
    const size = '200x200';
    document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=${size}&data=${encodeURIComponent(url)}`;
    document.getElementById('qrLinkText').textContent = url;
    document.getElementById('qrModal').classList.remove('hidden');
}

function closeQrModal() {
    document.getElementById('qrModal').classList.add('hidden');
}

async function deleteVoucher(id) {
    if (!confirm('Hapus voucher ini?')) return;
    const r = await fetch(`/api/hotspot/vouchers/delete/${id}`, {method:'DELETE'});
    const d = await r.json();
    if (d.success) loadVouchers(_page);
    else alert(d.error);
}

async function deleteExpired() {
    if (!confirm('Hapus semua voucher expired?')) return;
    const r = await fetch('/api/hotspot/vouchers/delete-expired', {method:'DELETE'});
    const d = await r.json();
    if (d.success) { showNotification(`${d.deleted} voucher expired berhasil dihapus!`, 'success'); loadVouchers(1); }
    else alert(d.error);
}

function openGenerateModal() {
    document.getElementById('generateResult').classList.add('hidden');
    document.getElementById('generateModal').classList.remove('hidden');
}
function closeGenerateModal() {
    document.getElementById('generateModal').classList.add('hidden');
    loadVouchers(_page);
}

async function submitGenerate() {
    const form = document.getElementById('generateForm');
    const body = {
        package: form.package.value,
        rate_limit: form.rate_limit.value,
        count: parseInt(form.count.value)
    };
    const r = await fetch('/api/hotspot/vouchers/generate', {
        method: 'POST',
        headers: {'Content-Type':'application/json', 'X-CSRFToken': document.querySelector('meta[name=csrf-token]')?.content || ''},
        body: JSON.stringify(body)
    });
    const d = await r.json();
    if (d.success) {
        const lines = d.vouchers.map(v => `Kode: ${v.voucher_code} | User: ${v.username} | Pass: ${v.password} | ${v.package}`).join('\n');
        document.getElementById('generateOutput').value = lines;
        document.getElementById('generateResult').classList.remove('hidden');
        showNotification('Voucher berhasil digenerate!', 'success');
    } else {
        alert(d.error);
    }
}

function openCreateModal() {
    document.getElementById('createForm').reset();
    document.getElementById('createModal').classList.remove('hidden');
}
function closeCreateModal() {
    document.getElementById('createModal').classList.add('hidden');
}
async function submitCreate() {
    const form = document.getElementById('createForm');
    const body = {
        voucher_code: form.voucher_code.value.trim(),
        username: form.username.value.trim(),
        password: form.password.value.trim(),
        package: form.package.value,
        rate_limit: form.rate_limit.value.trim()
    };
    const r = await fetch('/api/hotspot/vouchers/create', {
        method: 'POST',
        headers: {'Content-Type':'application/json', 'X-CSRFToken': document.querySelector('meta[name=csrf-token]')?.content || ''},
        body: JSON.stringify(body)
    });
    const d = await r.json();
    if (d.success) {
        closeCreateModal();
        showNotification('Voucher manual berhasil dibuat!', 'success');
        loadVouchers(1);
    } else {
        alert(d.error || 'Gagal membuat voucher');
    }
}

loadVouchers();
</script>
