<script>
    // === PARSER RATE LIMIT UNTUK TAMPILAN PREMIUM ===
    function parseRateLimit(rateLimitStr) {
        if (!rateLimitStr || rateLimitStr === 'Not set') {
            return '<span class="text-xs text-slate-400 dark:text-slate-500 font-medium">Batas tidak disetel</span>';
        }
        
        const parts = rateLimitStr.split(' ');
        const mainSpeed = parts[0].split('/');
        if (mainSpeed.length !== 2) {
            return `<span class="text-xs font-mono font-medium text-slate-600 dark:text-slate-400 bg-slate-100 dark:bg-slate-900 px-2 py-0.5 rounded border border-slate-200 dark:border-slate-800">${rateLimitStr}</span>`;
        }
        
        // Parse main speed (e.g. 10M -> 10 Mbps)
        const down = mainSpeed[0].replace('M', ' Mbps').replace('k', ' Kbps').replace('G', ' Gbps');
        const up = mainSpeed[1].replace('M', ' Mbps').replace('k', ' Kbps').replace('G', ' Gbps');
        
        let html = `<div class="flex flex-wrap items-center gap-1.5">
            <span class="inline-flex items-center text-xs font-semibold px-2 py-0.5 rounded-lg bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-400 border border-blue-100 dark:border-blue-900/20 speed-tag" title="Download Speed">
                <i data-lucide="arrow-down" class="w-3 h-3 mr-1 text-blue-500 inline-block"></i> ${down}
            </span>
            <span class="inline-flex items-center text-xs font-semibold px-2 py-0.5 rounded-lg bg-indigo-50 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-400 border border-indigo-100 dark:border-indigo-900/20 speed-tag" title="Upload Speed">
                <i data-lucide="arrow-up" class="w-3 h-3 mr-1 text-indigo-500 inline-block"></i> ${up}
            </span>`;
        
        // Priority (if present)
        if (parts.length >= 5) {
            const priority = parts[4];
            let pColor = 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-200/60 dark:border-slate-700/60';
            let pText = `Pri ${priority}`;
            if (priority === '1' || priority === '2') {
                pColor = 'bg-rose-50 dark:bg-rose-950/30 text-rose-700 dark:text-rose-400 border-rose-100 dark:border-rose-900/30';
                pText = `Pri ${priority} (Highest)`;
            } else if (priority === '3' || priority === '4') {
                pColor = 'bg-amber-50 dark:bg-amber-950/30 text-amber-700 dark:text-amber-400 border-amber-100 dark:border-amber-900/30';
            }
            html += `<span class="inline-flex items-center text-[10px] font-bold px-1.5 py-0.5 rounded border ${pColor}">${pText}</span>`;
        }
        
        // Burst (if present and not 0/0)
        if (parts.length >= 2 && parts[1] !== '0/0') {
            html += `<span class="inline-flex items-center text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-50 dark:bg-emerald-950/30 text-emerald-700 dark:text-emerald-400 border border-emerald-100 dark:border-emerald-900/30" title="Burst Aktif"><i data-lucide="zap" class="w-2.5 h-2.5 mr-1 text-emerald-500 inline-block"></i> Burst</span>`;
        }
        
        html += '</div>';
        return html;
    }

    // === FUNGSI UNTUK ADD USER ===
    function updateRateLimitPreview() {
        const down = document.getElementById('simpleDownload').value + document.getElementById('simpleDownloadUnit').value;
        const up = document.getElementById('simpleUpload').value + document.getElementById('simpleUploadUnit').value;
        const priority = document.getElementById('simplePriority').value;
        const enableBurst = document.getElementById('simpleEnableBurst').checked;

        let rateLimit = `${down}/${up}`;

        if (enableBurst) {
            const burstDown = (parseFloat(document.getElementById('simpleDownload').value) * 2) + document.getElementById('simpleDownloadUnit').value;
            const burstUp = (parseFloat(document.getElementById('simpleUpload').value) * 2) + document.getElementById('simpleUploadUnit').value;
            const threshDown = (parseFloat(document.getElementById('simpleDownload').value) * 0.5) + document.getElementById('simpleDownloadUnit').value;
            const threshUp = (parseFloat(document.getElementById('simpleUpload').value) * 0.5) + document.getElementById('simpleUploadUnit').value;
            rateLimit += ` ${burstDown}/${burstUp} ${threshDown}/${threshUp} 8/8`;
        } else {
            rateLimit += ` 0/0 0/0 0/0`;
        }

        rateLimit += ` ${priority}`;
        document.getElementById('rateLimitPreview').value = rateLimit;
    }

    async function copyRateLimit() {
        const input = document.getElementById('rateLimitPreview');
        try {
            await navigator.clipboard.writeText(input.value);
            showNotification('Rate limit disalin ke clipboard!', 'success');
        } catch (err) {
            showNotification('Gagal menyalin', 'error');
        }
    }

    function openAddUserModal() {
        document.getElementById('addUserModal').classList.remove('hidden');
        updateRateLimitPreview();
    }

    function closeAddUserModal() {
        document.getElementById('addUserModal').classList.add('hidden');
    }

    // === FUNGSI UNTUK EDIT USER ===
    function updateEditRateLimitPreview() {
        const down = document.getElementById('editSimpleDownload').value + document.getElementById('editSimpleDownloadUnit').value;
        const up = document.getElementById('editSimpleUpload').value + document.getElementById('editSimpleUploadUnit').value;
        const priority = document.getElementById('editSimplePriority').value;
        const enableBurst = document.getElementById('editSimpleEnableBurst').checked;

        let rateLimit = `${down}/${up}`;

        if (enableBurst) {
            const burstDown = (parseFloat(document.getElementById('editSimpleDownload').value) * 2) + document.getElementById('editSimpleDownloadUnit').value;
            const burstUp = (parseFloat(document.getElementById('editSimpleUpload').value) * 2) + document.getElementById('editSimpleUploadUnit').value;
            const threshDown = (parseFloat(document.getElementById('editSimpleDownload').value) * 0.5) + document.getElementById('editSimpleDownloadUnit').value;
            const threshUp = (parseFloat(document.getElementById('editSimpleUpload').value) * 0.5) + document.getElementById('editSimpleUploadUnit').value;
            rateLimit += ` ${burstDown}/${burstUp} ${threshDown}/${threshUp} 8/8`;
        } else {
            rateLimit += ` 0/0 0/0 0/0`;
        }

        rateLimit += ` ${priority}`;
        document.getElementById('editRateLimitPreview').value = rateLimit;
    }

    async function copyEditRateLimit() {
        const input = document.getElementById('editRateLimitPreview');
        try {
            await navigator.clipboard.writeText(input.value);
            showNotification('Rate limit disalin ke clipboard!', 'success');
        } catch (err) {
            showNotification('Gagal menyalin', 'error');
        }
    }

    function closeEditUserModal() {
        document.getElementById('editUserModal').classList.add('hidden');
    }

    // === FUNGSI UTAMA: editUser dan loadUsers ===
    async function editUser(username) {
        try {
            const response = await fetch(`/api/users/get/${encodeURIComponent(username)}`);
            if (!response.ok) throw new Error('Gagal mengambil data user');
            const user = await response.json();
            
            if (!user || user.error) {
                showNotification('User tidak ditemukan!', 'error');
                return;
            }
            
            document.getElementById('editUsername').value = user.username;
            document.getElementById('editUsernameDisplay').value = user.username;
            document.getElementById('editIpAddress').value = user.ip_address || '';
            document.getElementById('editIpv6Prefix').value = user.ipv6_prefix || '';
            document.getElementById('editDelegatedIpv6Prefix').value = user.delegated_ipv6_prefix || '';
            document.getElementById('editDataLimit').value = user.data_limit || '';
            document.getElementById('editSessionTimeout').value = user.session_timeout || '';
            document.getElementById('editIdleTimeout').value = user.idle_timeout || '';
            
            if (user.rate_limit) {
                const parts = user.rate_limit.split(' ');
                if (parts.length >= 1) {
                    const maxRate = parts[0].split('/');
                    if (maxRate.length === 2) {
                        const downMatch = maxRate[0].match(/(\d+)([kMG]?)/);
                        const upMatch = maxRate[1].match(/(\d+)([kMG]?)/);
                        if (downMatch && upMatch) {
                            document.getElementById('editSimpleDownload').value = downMatch[1];
                            document.getElementById('editSimpleDownloadUnit').value = downMatch[2] || 'M';
                            document.getElementById('editSimpleUpload').value = upMatch[1];
                            document.getElementById('editSimpleUploadUnit').value = upMatch[2] || 'M';
                        }
                    }
                    if (parts.length >= 5) {
                        const priorityMatch = parts[4].match(/(\d+)/);
                        if (priorityMatch) document.getElementById('editSimplePriority').value = priorityMatch[1];
                    }
                    if (parts.length >= 2 && parts[1] !== '0/0') {
                        document.getElementById('editSimpleEnableBurst').checked = true;
                    } else {
                        document.getElementById('editSimpleEnableBurst').checked = false;
                    }
                }
            }
            
            updateEditRateLimitPreview();
            document.getElementById('editUserModal').classList.remove('hidden');
            
        } catch (error) {
            console.error('Error loading user data:', error);
            showNotification('Error mengambil data user', 'error');
        }
    }

    let searchTimeout;
    document.getElementById('userSearch').addEventListener('input', function(e) {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            currentPage = 1;
            loadUsers(e.target.value);
        }, 300);
    });

    let currentPage = 1;
    const itemsPerPage = 20;

    async function changePage(page) {
        if (page < 1) return;
        currentPage = page;
        await loadUsers();
    }

    async function loadUsers(searchQuery = document.getElementById('userSearch').value) {
        const usersList = document.getElementById('usersList');
        
        try {
            const url = new URL('/api/users', window.location.origin);
            url.searchParams.append('page', currentPage);
            url.searchParams.append('limit', itemsPerPage);
            if (searchQuery) url.searchParams.append('search', searchQuery);
            
            const response = await fetch(url);
            const result = await response.json();
            const users = result.users || [];
            
            // Update pagination UI
            document.getElementById('totalItems').textContent = result.total || 0;
            document.getElementById('startRange').textContent = result.total ? (currentPage - 1) * itemsPerPage + 1 : 0;
            document.getElementById('endRange').textContent = Math.min(currentPage * itemsPerPage, result.total || 0);
            
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage >= result.total_pages;
            
            // Generate page numbers
            let pageHtml = '';
            for (let i = 1; i <= result.total_pages; i++) {
                if (i === 1 || i === result.total_pages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    pageHtml += `
                        <button onclick="changePage(${i})" class="w-10 h-10 rounded-xl font-bold transition-all ${i === currentPage ? 'bg-purple-600 text-white shadow-md' : 'bg-gray-150 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-gray-200 dark:hover:bg-slate-600'}">
                            ${i}
                        </button>
                    `;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    pageHtml += '<span class="flex items-center text-slate-400">...</span>';
                }
            }
            document.getElementById('pageNumbers').innerHTML = pageHtml;

            if (users.length === 0) {
                if (searchQuery) {
                    usersList.innerHTML = `
                        <div class="text-center py-20 bg-slate-50/50 dark:bg-slate-900/30 rounded-2xl border border-dashed border-slate-200 dark:border-slate-700">
                            <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm">
                                <i data-lucide="search" class="w-8 h-8 text-slate-400"></i>
                            </div>
                            <p class="text-slate-800 dark:text-slate-200 font-bold text-lg mb-1">Pencarian Tidak Ditemukan</p>
                            <p class="text-slate-500 text-xs">Tidak ada pelanggan PPPoE yang cocok dengan "${searchQuery}"</p>
                        </div>
                    `;
                } else {
                    usersList.innerHTML = `
                        <div class="text-center py-20 bg-slate-50/50 dark:bg-slate-900/30 rounded-2xl border border-dashed border-slate-200 dark:border-slate-700">
                            <div class="w-16 h-16 bg-gradient-to-br from-slate-100 to-slate-200 dark:from-slate-850 dark:to-slate-800 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-md">
                                <i data-lucide="users" class="w-8 h-8 text-slate-400"></i>
                            </div>
                            <p class="text-slate-800 dark:text-slate-200 font-bold text-lg mb-1">Belum Ada Pelanggan</p>
                            <p class="text-slate-500 text-xs mb-5">Silakan tambahkan pelanggan PPPoE pertama Anda untuk memulai.</p>
                            <button onclick="openAddUserModal()" class="bg-gradient-to-r from-purple-600 to-indigo-650 hover:from-purple-700 hover:to-indigo-750 text-white px-5 py-2.5 rounded-xl font-bold shadow-md transition-all">
                                <i data-lucide="user-plus" class="w-4 h-4 mr-2 inline-block"></i>Tambah Pelanggan Pertama
                            </button>
                        </div>
                    `;
                }
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            let html = `
                <div class="overflow-x-auto min-w-full">
                    <table class="w-full min-w-[760px] text-left border-collapse align-middle">
                        <thead>
                            <tr class="border-b border-slate-100 dark:border-slate-750 text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">
                                <th class="pb-3 pt-1 px-4 font-extrabold whitespace-nowrap">PELANGGAN</th>
                                <th class="pb-3 pt-1 px-4 font-extrabold whitespace-nowrap">STATUS</th>
                                <th class="pb-3 pt-1 px-4 font-extrabold whitespace-nowrap">ALAMAT IP</th>
                                <th class="pb-3 pt-1 px-4 font-extrabold whitespace-nowrap">RATE LIMIT (BW)</th>
                                <th class="pb-3 pt-1 px-4 font-extrabold text-right whitespace-nowrap min-w-[200px]">AKSI</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100/60 dark:divide-slate-750/60">
            `;
            users.forEach(user => {
                const isOnline = user.active_sessions > 0;
                const statusBadge = isOnline
                    ? '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-50 dark:bg-emerald-950/45 text-emerald-700 dark:text-emerald-400 border border-emerald-100 dark:border-emerald-900/30"><span class="w-1.5 h-1.5 bg-emerald-500 rounded-full online-indicator-dot"></span>Online</span>'
                    : '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold bg-slate-50 dark:bg-slate-900/40 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700/60">Offline</span>';
                
                const uname = user.username || '';
                const safeUname = uname.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                const userId = user.id || 0;

                const throttleBtns = isOnline
                    ? '<button onclick="throttleUser(\'' + safeUname + '\')" class="table-action-btn bg-amber-50 hover:bg-amber-500 dark:bg-amber-950/40 dark:hover:bg-amber-600 text-amber-600 hover:text-white dark:text-amber-400 dark:hover:text-white border border-amber-200/50 dark:border-amber-800/40 transition-all duration-200 shadow-sm" title="Throttle Speed"><i data-lucide="gauge" class="w-4 h-4"></i></button>'
                    + '<button onclick="unthrottleUser(\'' + safeUname + '\')" class="table-action-btn bg-emerald-50 hover:bg-emerald-500 dark:bg-emerald-950/40 dark:hover:bg-emerald-600 text-emerald-600 hover:text-white dark:text-emerald-400 dark:hover:text-white border border-emerald-200/50 dark:border-emerald-800/40 transition-all duration-200 shadow-sm" title="Kembalikan Kecepatan"><i data-lucide="rocket" class="w-4 h-4"></i></button>'
                    : '';
                
                const leftBorderClass = isOnline 
                    ? 'border-l-[4px] border-l-emerald-500 dark:border-l-emerald-600' 
                    : 'border-l-[4px] border-l-slate-250 dark:border-l-slate-700';

                let ipDisplay = '<div class="flex flex-col gap-0.5">';
                ipDisplay += '<span class="text-xs font-mono text-slate-600 dark:text-slate-400 flex items-center gap-1.5"><i data-lucide="network" class="w-3.5 h-3.5 text-slate-400"></i>' + (user.ip_address || 'Dynamic (IPv4)') + '</span>';
                if (user.ipv6_prefix || user.delegated_ipv6_prefix) {
                    if (user.ipv6_prefix) {
                        ipDisplay += '<span class="text-[10px] font-mono text-slate-500 dark:text-slate-400 flex items-center gap-1" title="Framed IPv6 Prefix"><i data-lucide="link" class="w-2.5 h-2.5 text-slate-400"></i>' + user.ipv6_prefix + '</span>';
                    }
                    if (user.delegated_ipv6_prefix) {
                        ipDisplay += '<span class="text-[10px] font-mono text-slate-500 dark:text-slate-400 flex items-center gap-1" title="Delegated IPv6 Prefix (PD)"><i data-lucide="share-2" class="w-2.5 h-2.5 text-slate-400"></i>' + user.delegated_ipv6_prefix + '</span>';
                    }
                }
                ipDisplay += '</div>';

                html += '<tr class="row-card-item transition-all duration-200 ' + leftBorderClass + '">'
                    + '<td class="py-3 px-4 whitespace-nowrap">'
                    + '<div class="flex items-center gap-3">'
                    + '<div class="w-8 h-8 rounded-xl flex items-center justify-center shadow-sm flex-shrink-0" style="background:linear-gradient(135deg,#667eea,#764ba2);"><i data-lucide="user" class="w-4 h-4 text-white"></i></div>'
                    + '<span class="font-bold text-slate-800 dark:text-slate-250 text-sm truncate">' + uname + '</span>'
                    + '</div>'
                    + '</td>'
                    + '<td class="py-3 px-4 whitespace-nowrap">' + statusBadge + '</td>'
                    + '<td class="py-3 px-4 whitespace-nowrap">' + ipDisplay + '</td>'
                    + '<td class="py-3 px-4 whitespace-nowrap">' + parseRateLimit(user.rate_limit || 'Not set') + '</td>'
                    + '<td class="py-3 px-4 text-right whitespace-nowrap min-w-[200px]">'
                    + '<div class="flex items-center gap-1.5 justify-end flex-nowrap">'
                    + '<button onclick="showDeviceInfo(\'' + safeUname + '\')" class="table-action-btn text-white transition-all duration-200 hover:scale-105 shadow-sm" style="background:linear-gradient(135deg,#06b6d4,#3b82f6);" title="Info Perangkat (GenieACS)"><i data-lucide="radio" class="w-4 h-4"></i></button>'
                    + '<button onclick="editUser(\'' + safeUname + '\')" class="table-action-btn bg-blue-50 hover:bg-blue-500 dark:bg-blue-950/40 dark:hover:bg-blue-600 text-blue-600 hover:text-white dark:text-blue-400 dark:hover:text-white border border-blue-200/50 dark:border-blue-800/40 transition-all duration-200 shadow-sm" title="Edit Akun"><i data-lucide="edit" class="w-4 h-4"></i></button>'
                    + throttleBtns
                    + '<button onclick="deleteUser(' + userId + ', \'' + safeUname + '\')" class="table-action-btn bg-rose-50 hover:bg-rose-500 dark:bg-rose-950/40 dark:hover:bg-rose-600 text-rose-600 hover:text-white dark:text-rose-400 dark:hover:text-white border border-rose-200/50 dark:border-rose-800/40 transition-all duration-200 shadow-sm" title="Hapus"><i data-lucide="trash-2" class="w-4 h-4"></i></button>'
                    + '</div>'
                    + '</td>'
                    + '</tr>';
            });
            html += '</tbody></table></div>';
            usersList.innerHTML = html;
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
            loadPppoeStats();
        } catch (error) {
            console.error('Error loading users:', error);
            usersList.innerHTML = `
                <div class="text-center py-20 bg-rose-50/20 dark:bg-rose-950/10 rounded-2xl border border-dashed border-rose-200 dark:border-rose-900/30">
                    <i data-lucide="alert-triangle" class="w-10 h-10 text-rose-500 mx-auto mb-3"></i>
                    <p class="text-slate-800 dark:text-slate-200 font-bold text-lg mb-1">Gagal Memuat Pelanggan</p>
                    <p class="text-slate-500 text-xs">${error.message}</p>
                </div>
            `;
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }
    }

    async function loadPppoeStats() {
        try {
            const res = await (await fetch('/api/stats')).json();
            const total = res.pppoe_users || 0;
            const online = res.pppoe_sessions || 0;
            const offline = Math.max(0, total - online);
            const pct = total ? Math.round((online / total) * 100) : 0;
            
            document.getElementById('statPppoeTotal').textContent = total;
            document.getElementById('statPppoeOnline').textContent = online;
            document.getElementById('statPppoeOnlinePct').textContent = pct + '%';
            
            // Set Donut Chart attributes
            const donutSegment = document.getElementById('statPppoeOnlineDonut');
            if (donutSegment) {
                donutSegment.setAttribute('stroke-dasharray', `${pct} 100`);
            }
            const donutText = document.getElementById('statPppoeDonutText');
            if (donutText) {
                donutText.textContent = pct + '%';
            }
            
            document.getElementById('statPppoeOffline').textContent = offline;
        } catch (e) {
            console.error('Error loading PPPoE stats:', e);
        }
    }

    async function throttleUser(username) {
        try {
            const r = await fetch(`/api/users/throttle/${username}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({rate_limit: '512k/512k'})
            });
            const result = await r.json();
            showNotification(result.message || result.error, result.success ? 'success' : 'error');
            if (result.success) loadUsers();
        } catch(e) { showNotification(e.message, 'error'); }
    }

    async function unthrottleUser(username) {
        try {
            const r = await fetch(`/api/users/unthrottle/${username}`, {method: 'POST'});
            const result = await r.json();
            showNotification(result.message || result.error, result.success ? 'success' : 'error');
            if (result.success) loadUsers();
        } catch(e) { showNotification(e.message, 'error'); }
    }

    let _deleteUsername = null;

    function deleteUser(userId, username) {
        _deleteUsername = username;
        document.getElementById('deleteUsername').textContent = username;
        document.getElementById('deleteConfirmModal').classList.remove('hidden');
    }

    function closeDeleteModal() {
        _deleteUsername = null;
        document.getElementById('deleteConfirmModal').classList.add('hidden');
    }

    async function confirmDelete() {
        if (!_deleteUsername) return;
        const username = _deleteUsername;
        closeDeleteModal();
        try {
            const response = await fetch(`/api/users/delete/by-username/${encodeURIComponent(username)}`, { method: 'DELETE' });
            if (response.status === 401) { window.location.href = '/login'; return; }
            const result = await response.json();
            if (result.success) {
                showNotification('User berhasil dihapus!', 'success');
                loadUsers();
            } else {
                showNotification('Error: ' + result.error, 'error');
            }
        } catch (error) {
            showNotification('Error: ' + error.message, 'error');
        }
    }

    // === DEVICE INFO (GenieACS) ===
    async function showDeviceInfo(username) {
        document.getElementById('deviceInfoModal').classList.remove('hidden');
        document.getElementById('deviceInfoUsername').textContent = username;
        document.getElementById('deviceInfoLoading').classList.remove('hidden');
        document.getElementById('deviceInfoNotFound').classList.add('hidden');
        document.getElementById('deviceInfoData').classList.add('hidden');

        try {
            const resp = await fetch(`/api/users/${encodeURIComponent(username)}/device`);
            const data = await resp.json();

            document.getElementById('deviceInfoLoading').classList.add('hidden');

            if (!data.found) {
                document.getElementById('deviceInfoNotFoundMsg').textContent = data.message || 'Device tidak ditemukan';
                document.getElementById('deviceInfoNotFound').classList.remove('hidden');
                return;
            }

            // RX Power card color and gauge calculation
            const rxCard = document.getElementById('di_rx_card');
            const rxBadge = document.getElementById('di_rx_badge');
            const gaugeFill = document.getElementById('di_rx_gauge_fill');
            
            const rxStyles = {
                good:    { bg: 'linear-gradient(135deg,#059669,#0d9488)', badge: '✓ Sinyal Bagus' },
                warning: { bg: 'linear-gradient(135deg,#d97706,#ea580c)', badge: '⚠ Sinyal Lemah' },
                bad:     { bg: 'linear-gradient(135deg,#dc2626,#be123c)', badge: '✗ Sinyal Buruk' },
                unknown: { bg: 'linear-gradient(135deg,#334155,#475569)', badge: '— N/A' },
            };
            const s = rxStyles[data.rx_status] || rxStyles.unknown;
            rxCard.style.background = s.bg;
            rxBadge.textContent = s.badge;

            document.getElementById('di_rx_power').textContent = data.rx_power !== 'N/A' ? `${data.rx_power} dBm` : 'N/A';
            
            // Calculate and animate gauge percentage
            let pct = 0;
            let gaugeBgColor = 'rgba(255,255,255,0.7)';
            if (data.rx_power !== 'N/A') {
                const powerVal = parseFloat(data.rx_power);
                if (!isNaN(powerVal)) {
                    // Normalize between -35 (0%) and -10 (100%)
                    pct = Math.min(100, Math.max(0, Math.round(((powerVal - (-35)) / (-10 - (-35))) * 100)));
                    if (data.rx_status === 'good') {
                        gaugeBgColor = '#34d399'; // Green/Emerald
                    } else if (data.rx_status === 'warning') {
                        gaugeBgColor = '#fbbf24'; // Amber
                    } else if (data.rx_status === 'bad') {
                        gaugeBgColor = '#f87171'; // Red
                    }
                }
            }
            if (gaugeFill) {
                gaugeFill.style.width = pct + '%';
                gaugeFill.style.backgroundColor = gaugeBgColor;
            }

            document.getElementById('di_manufacturer').textContent = data.manufacturer;
            document.getElementById('di_model').textContent = data.model;
            document.getElementById('di_serial').textContent = data.serial;
            document.getElementById('di_pon_mode').textContent = data.pon_mode;
            document.getElementById('di_temperature').textContent = data.temperature !== 'N/A' ? `${data.temperature} °C` : 'N/A';
            document.getElementById('di_firmware').textContent = data.firmware || '-';
            document.getElementById('di_pppoe_ip').textContent = data.pppoe_ip || '-';
            document.getElementById('di_device_uptime').textContent = data.device_uptime;
            document.getElementById('di_ppp_uptime').textContent = data.ppp_uptime;
            document.getElementById('di_last_inform').textContent = data.last_inform ? new Date(data.last_inform).toLocaleString('id-ID') : '-';

            document.getElementById('deviceInfoData').classList.remove('hidden');
        } catch (e) {
            document.getElementById('deviceInfoLoading').classList.add('hidden');
            document.getElementById('deviceInfoNotFoundMsg').textContent = 'Error: ' + e.message;
            document.getElementById('deviceInfoNotFound').classList.remove('hidden');
        }
    }

    // === EVENT LISTENERS ===
    document.addEventListener('DOMContentLoaded', function() {
        loadUsers();
        updateRateLimitPreview();
    });

    document.getElementById('addUserForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const submitBtn = this.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span class="inline-block w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin mr-2"></span>Menyimpan...';
        submitBtn.disabled = true;

        try {
            const formData = new FormData(this);
            const response = await fetch('/api/users/add', {
                method: 'POST',
                body: formData
            });
            
            const result = await response.json();
            
            if (result.success) {
                showNotification('User berhasil ditambahkan!', 'success');
                closeAddUserModal();
                this.reset();
                updateRateLimitPreview();
                loadUsers();
            } else {
                showNotification('Error: ' + result.error, 'error');
            }
            
        } catch (error) {
            console.error('Error adding user:', error);
            showNotification('Error: ' + error.message, 'error');
        } finally {
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        }
    });

    document.getElementById('editUserForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const submitBtn = this.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span class="inline-block w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin mr-2"></span>Menyimpan...';
        submitBtn.disabled = true;

        try {
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            const username = document.getElementById('editUsername').value;
            
            if (!data.password) delete data.password;
            
            const response = await fetch(`/api/users/update/${username}`, {
                method: 'PUT',
                body: JSON.stringify(data),
                headers: { 'Content-Type': 'application/json' }
            });
            
            const result = await response.json();
            
            if (result.success) {
                showNotification('User berhasil diperbarui!', 'success');
                closeEditUserModal();
                loadUsers();
            } else {
                showNotification('Error: ' + result.error, 'error');
            }
            
        } catch (error) {
            console.error('Error updating user:', error);
            showNotification('Error: ' + error.message, 'error');
        } finally {
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        }
    });
</script>
