<script>
let currentPage = 1;
let currentLimit = 20;
let totalUsers = 0;
let searchTimeout = null;

async function loadUsers() {
    const searchVal = document.getElementById('searchInput')?.value || '';
    const limitVal = document.getElementById('limitSelect')?.value || 20;
    currentLimit = parseInt(limitVal);
    
    showLoadingState();
    hideEmptyState();

    try {
        const response = await fetch(`/api/wireless/users?page=${currentPage}&limit=${currentLimit}&search=${encodeURIComponent(searchVal)}`);
        const data = await response.json();
        
        if (!response.ok) throw new Error(data.error || 'Server error');
        if (!data.users) throw new Error('Data format error');

        totalUsers = data.total;
        
        // Update Stats
        document.getElementById('statTotal').textContent = totalUsers;
        
        // Count active sessions
        const onlineCount = data.users.reduce((acc, curr) => acc + (curr.active_sessions > 0 ? 1 : 0), 0);
        document.getElementById('statOnline').textContent = onlineCount;

        hideLoadingState();

        if (data.users.length === 0) {
            showEmptyState();
            updatePagination(0, 0, 0);
            return;
        }

        renderUsersTable(data.users);
        const start = (currentPage - 1) * currentLimit + 1;
        const end = Math.min(start + data.users.length - 1, totalUsers);
        updatePagination(start, end, totalUsers);

    } catch (e) {
        hideLoadingState();
        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-red-500 font-bold"><i data-lucide="alert-triangle" class="inline w-4 h-4 mr-2"></i>Error: ${e.message}</td></tr>`;
        lucide.createIcons();
    }
}

function renderUsersTable(users) {
    const tbody = document.getElementById('usersTableBody');
    tbody.innerHTML = users.map(u => {
        const isOnline = u.active_sessions > 0;
        const statusBadge = isOnline 
            ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold bg-green-50 text-green-700 border border-green-100 dark:bg-green-900/20 dark:text-green-400 dark:border-green-800"><span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>Online</span>`
            : `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold bg-gray-50 text-gray-500 border border-gray-100 dark:bg-gray-900/20 dark:text-gray-400 dark:border-gray-800">Offline</span>`;

        return `
            <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-700/50 transition-colors">
                <td class="py-4 px-6">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center shadow-sm flex-shrink-0 bg-gradient-to-tr from-violet-500 to-purple-600">
                            <i data-lucide="radio" class="w-4 h-4 text-white"></i>
                        </div>
                        <span class="font-bold text-slate-800 dark:text-white text-sm truncate">${escapeHtml(u.username)}</span>
                    </div>
                </td>
                <td class="py-4 px-6">
                    <span class="text-xs font-mono text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-700 px-2 py-0.5 rounded border border-slate-100 dark:border-slate-600">
                        ${'•'.repeat(8)}
                    </span>
                </td>
                <td class="py-4 px-6 text-center">${statusBadge}</td>
                <td class="py-4 px-6 text-center">
                    <span class="text-sm font-bold text-slate-800 dark:text-white">${u.active_sessions}</span>
                </td>
                <td class="py-4 px-6 text-center">
                    <div class="flex justify-center gap-2">
                        <button onclick="openDetailModal('${escapeHtml(u.username)}')"
                                class="w-8 h-8 bg-purple-50 dark:bg-purple-900/20 hover:bg-purple-500 text-purple-600 dark:text-purple-400 hover:text-white rounded-lg transition-colors flex items-center justify-center shadow-sm"
                                title="Detail Sesi">
                            <i data-lucide="info" class="w-4 h-4"></i>
                        </button>
                        <button onclick="openEditModal('${escapeHtml(u.username)}')" 
                                class="w-8 h-8 bg-blue-50 dark:bg-blue-900/20 hover:bg-blue-500 text-blue-600 dark:text-blue-400 hover:text-white rounded-lg transition-colors flex items-center justify-center shadow-sm" 
                                title="Edit User">
                            <i data-lucide="edit" class="w-4 h-4"></i>
                        </button>
                        <button onclick="deleteUser('${escapeHtml(u.username)}')" 
                                class="w-8 h-8 bg-red-50 dark:bg-red-900/20 hover:bg-red-500 text-red-600 dark:text-red-400 hover:text-white rounded-lg transition-colors flex items-center justify-center shadow-sm" 
                                title="Hapus User">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </td>
            </tr>
        `;
    }).join('');
    lucide.createIcons();
}

function updatePagination(start, end, total) {
    const paginationDiv = document.getElementById('pagination');
    if (!paginationDiv) return;

    const totalPages = Math.ceil(total / currentLimit);
    
    if (totalPages <= 1) {
        paginationDiv.innerHTML = total > 0 ? `<p class="text-sm text-slate-600 dark:text-slate-400">Menampilkan ${total} user</p>` : '';
        return;
    }

    paginationDiv.innerHTML = `
        <p class="text-sm text-slate-600 dark:text-slate-400">
            Menampilkan ${start}-${end} dari ${total} user
        </p>
        <div class="flex items-center gap-2">
            <button onclick="changePage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''} 
                    class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${currentPage <= 1 ? 'bg-gray-100 text-gray-400 cursor-not-allowed dark:bg-gray-800 dark:text-gray-600' : 'bg-gray-100 text-gray-600 hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600'}">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <div id="pageNumbers" class="flex gap-1"></div>
            <button onclick="changePage(${currentPage + 1})" ${end >= total ? 'disabled' : ''} 
                    class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${end >= total ? 'bg-gray-100 text-gray-400 cursor-not-allowed dark:bg-gray-800 dark:text-gray-600' : 'bg-gray-100 text-gray-600 hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600'}">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
        </div>
    `;

    // Render page numbers
    const numsDiv = document.getElementById('pageNumbers');
    for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
            const btn = document.createElement('button');
            btn.textContent = i;
            btn.className = `px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${i === currentPage ? 'bg-purple-500 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600'}`;
            btn.onclick = () => changePage(i);
            numsDiv.appendChild(btn);
        } else if (i === 2 || i === totalPages - 1) {
            const span = document.createElement('span');
            span.textContent = '...';
            span.className = 'px-2 py-1.5 text-xs text-gray-400';
            numsDiv.appendChild(span);
        }
    }
    lucide.createIcons();
}

function changePage(page) {
    if (page < 1 || page > Math.ceil(totalUsers / currentLimit)) return;
    currentPage = page;
    loadUsers();
}

function showLoadingState() {
    document.getElementById('loadingState')?.classList.remove('hidden');
    document.getElementById('usersTableBody').innerHTML = '';
}

function hideLoadingState() {
    document.getElementById('loadingState')?.classList.add('hidden');
}

function showEmptyState() {
    document.getElementById('emptyState')?.classList.remove('hidden');
}

function hideEmptyState() {
    document.getElementById('emptyState')?.classList.add('hidden');
}

// Modal Functions
function openAddModal() {
    document.getElementById('addModal').classList.remove('hidden');
    document.getElementById('addUsername').value = '';
    document.getElementById('addPassword').value = '';
    document.getElementById('addUsername').focus();
}

function closeAddModal() {
    document.getElementById('addModal').classList.add('hidden');
}

function openEditModal(username) {
    document.getElementById('editModal').classList.remove('hidden');
    document.getElementById('editOriginalUsername').value = username;
    document.getElementById('editUsername').value = username;
    document.getElementById('editPassword').value = '';
    document.getElementById('editUsername').focus();
}

function closeEditModal() {
    document.getElementById('editModal').classList.add('hidden');
}

// Detail Modal Functions
async function openDetailModal(username) {
    document.getElementById('detailModal').classList.remove('hidden');
    document.getElementById('detailUsername').textContent = username;
    document.getElementById('detailLoading').classList.remove('hidden');
    document.getElementById('detailEmpty').classList.add('hidden');
    document.getElementById('detailContent').innerHTML = '';

    try {
        const response = await fetch(`/api/wireless/users/detail/${encodeURIComponent(username)}`);
        const data = await response.json();

        document.getElementById('detailLoading').classList.add('hidden');

        if (!data.success) throw new Error(data.error || 'Gagal memuat detail');

        if (!data.sessions || data.sessions.length === 0) {
            document.getElementById('detailEmpty').classList.remove('hidden');
            lucide.createIcons();
            return;
        }

        const container = document.getElementById('detailContent');
        container.innerHTML = data.sessions.map((s, idx) => {
            const isOnline = s.status === 'Online';
            const statusBadge = isOnline
                ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-bold bg-green-50 text-green-700 border border-green-100 dark:bg-green-900/20 dark:text-green-400"><span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>Online</span>`
                : `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-bold bg-gray-50 text-gray-500 border border-gray-100 dark:bg-gray-800 dark:text-gray-400">Offline</span>`;

            return `
            <div class="border border-slate-200 dark:border-slate-600 rounded-2xl p-4 ${idx === 0 ? 'bg-purple-50/50 dark:bg-purple-900/10 border-purple-200 dark:border-purple-800' : 'bg-slate-50 dark:bg-slate-700/50'}">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Sesi #${idx + 1} ${idx === 0 ? '(Terbaru)' : ''}</span>
                    ${statusBadge}
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-0.5">
                        <p class="text-xs text-slate-400 dark:text-slate-500 font-medium">IP Client</p>
                        <p class="text-sm font-bold text-slate-700 dark:text-slate-200 font-mono">${escapeHtml(s.framedipaddress)}</p>
                    </div>
                    <div class="space-y-0.5">
                        <p class="text-xs text-slate-400 dark:text-slate-500 font-medium">NAS / Router</p>
                        <p class="text-sm font-bold text-slate-700 dark:text-slate-200 font-mono">${escapeHtml(s.nasipaddress)}</p>
                    </div>
                    <div class="space-y-0.5">
                        <p class="text-xs text-slate-400 dark:text-slate-500 font-medium">MAC Device</p>
                        <p class="text-sm font-bold text-slate-700 dark:text-slate-200 font-mono">${escapeHtml(s.callingstationid)}</p>
                    </div>
                    <div class="space-y-0.5">
                        <p class="text-xs text-slate-400 dark:text-slate-500 font-medium">AP + SSID</p>
                        <p class="text-sm font-bold text-slate-700 dark:text-slate-200 font-mono truncate" title="${escapeHtml(s.calledstationid)}">${escapeHtml(s.calledstationid)}</p>
                    </div>
                    <div class="space-y-0.5">
                        <p class="text-xs text-slate-400 dark:text-slate-500 font-medium">Mulai Konek</p>
                        <p class="text-sm font-bold text-slate-700 dark:text-slate-200">${escapeHtml(s.acctstarttime)}</p>
                    </div>
                    <div class="space-y-0.5">
                        <p class="text-xs text-slate-400 dark:text-slate-500 font-medium">Durasi</p>
                        <p class="text-sm font-bold text-slate-700 dark:text-slate-200">${escapeHtml(s.duration)}</p>
                    </div>
                    <div class="space-y-0.5">
                        <p class="text-xs text-slate-400 dark:text-slate-500 font-medium flex items-center gap-1"><i data-lucide="arrow-down" class="w-3 h-3 text-green-500"></i>Download</p>
                        <p class="text-sm font-bold text-green-600 dark:text-green-400">${escapeHtml(s.download)}</p>
                    </div>
                    <div class="space-y-0.5">
                        <p class="text-xs text-slate-400 dark:text-slate-500 font-medium flex items-center gap-1"><i data-lucide="arrow-up" class="w-3 h-3 text-blue-500"></i>Upload</p>
                        <p class="text-sm font-bold text-blue-600 dark:text-blue-400">${escapeHtml(s.upload)}</p>
                    </div>
                </div>
                ${s.acctterminatecause !== '-' ? `
                <div class="mt-3 pt-3 border-t border-slate-200 dark:border-slate-600">
                    <p class="text-xs text-slate-400 dark:text-slate-500 font-medium">Terminate Cause</p>
                    <p class="text-xs font-mono text-orange-600 dark:text-orange-400 mt-0.5">${escapeHtml(s.acctterminatecause)}</p>
                </div>` : ''}
            </div>
            `;
        }).join('');

        lucide.createIcons();

    } catch (e) {
        document.getElementById('detailLoading').classList.add('hidden');
        document.getElementById('detailContent').innerHTML = `
            <div class="text-center py-8 text-red-500">
                <i data-lucide="alert-triangle" class="w-8 h-8 mx-auto mb-2"></i>
                <p class="font-medium">Error: ${e.message}</p>
            </div>`;
        lucide.createIcons();
    }
}

function closeDetailModal() {
    document.getElementById('detailModal').classList.add('hidden');
    document.getElementById('detailContent').innerHTML = '';
}

// Form Handlers
document.getElementById('addUserForm')?.addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const username = document.getElementById('addUsername').value.trim();
    const password = document.getElementById('addPassword').value.trim();
    
    if (!username || !password) {
        showNotification('Username dan password wajib diisi!', 'error');
        return;
    }

    try {
        const response = await fetch('/api/wireless/users/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        
        const result = await response.json();
        
        if (result.success) {
            showNotification(result.message || 'User wireless berhasil ditambahkan!', 'success');
            closeAddModal();
            loadUsers();
        } else {
            showNotification(result.error || 'Gagal menambahkan user', 'error');
        }
    } catch (e) {
        showNotification('Error: ' + e.message, 'error');
    }
});

document.getElementById('editUserForm')?.addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const originalUsername = document.getElementById('editOriginalUsername').value;
    const username = document.getElementById('editUsername').value.trim();
    const password = document.getElementById('editPassword').value.trim();
    
    if (!username) {
        showNotification('Username wajib diisi!', 'error');
        return;
    }

    try {
        const payload = {username};
        if (password) payload.password = password;

        const response = await fetch(`/api/wireless/users/update/${encodeURIComponent(originalUsername)}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        
        const result = await response.json();
        
        if (result.success) {
            showNotification(result.message || 'User wireless berhasil diupdate!', 'success');
            closeEditModal();
            loadUsers();
        } else {
            showNotification(result.error || 'Gagal mengupdate user', 'error');
        }
    } catch (e) {
        showNotification('Error: ' + e.message, 'error');
    }
});

async function deleteUser(username) {
    if (!confirm(`Yakin ingin menghapus user wireless "${username}"?\n\nUser akan dihapus dari sistem dan tidak dapat login lagi.`)) return;

    try {
        const response = await fetch(`/api/wireless/users/delete/${encodeURIComponent(username)}`, {
            method: 'DELETE'
        });
        
        const result = await response.json();
        
        if (result.success) {
            showNotification(result.message || 'User wireless berhasil dihapus!', 'success');
            loadUsers();
        } else {
            showNotification(result.error || 'Gagal menghapus user', 'error');
        }
    } catch (e) {
        showNotification('Error: ' + e.message, 'error');
    }
}

// Search Handler
document.getElementById('searchInput')?.addEventListener('input', function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        currentPage = 1;
        loadUsers();
    }, 300);
});

// Limit Handler
document.getElementById('limitSelect')?.addEventListener('change', function() {
    currentPage = 1;
    loadUsers();
});

// Utility Functions
function escapeHtml(text) {
    if (typeof text !== 'string') return '';
    const map = {'&': '&amp;','<': '&lt;','>': '&gt;','"': '&quot;',"'": '&#039;'};
    return text.replace(/[&<>"']/g, m => map[m]);
}

function showNotification(message, type = 'info') {
    if (typeof showToast === 'function') {
        showToast(message, type);
    } else {
        alert(message);
    }
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
    loadUsers();
});
</script>
