<script>
// Utility: escape HTML to prevent XSS
if (typeof window.escapeHtml !== 'function') {
    window.escapeHtml = function(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.appendChild(document.createTextNode(String(str)));
        return div.innerHTML;
    };
}

// Utility: apiCall wrapper if not already defined
if (typeof window.apiCall !== 'function') {
    window.apiCall = async function(url, options = {}) {
        const res = await fetch(url, {
            headers: { 'Content-Type': 'application/json' },
            ...options
        });
        return await res.json();
    };
}

let vpnPage = 1;
let vpnLimit = 20;
let vpnTotal = 0;
let vpnSearchTimeout = null;

async function loadVpnUsers() {
    const searchVal = document.getElementById('vpnSearch').value;
    const tbody = document.getElementById('vpnTableBody');
    tbody.innerHTML = `<tr><td colspan="7" class="text-center py-10 text-gray-400"><i class="fas fa-spinner fa-spin mr-2"></i>Loading data...</td></tr>`;

    try {
        const data = await apiCall(`/api/vpn/users?page=${vpnPage}&limit=${vpnLimit}&search=${encodeURIComponent(searchVal)}`);
        if (!data || !data.users) throw new Error('Data format error');

        vpnTotal = data.total;
        
        // Update Stats
        document.getElementById('statTotal').textContent = vpnTotal;
        
        // Use global online_count returned by API
        const onlineCount = data.online_count !== undefined ? data.online_count : 0;
        document.getElementById('statOnline').textContent = onlineCount;

        if (data.users.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center py-10 text-gray-400">Tidak ada user VPN ditemukan.</td></tr>`;
            updatePagination(0, 0, 0);
            return;
        }

        tbody.innerHTML = data.users.map(u => {
            const isOnline = u.active_sessions > 0;
            const statusBadge = isOnline 
                ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold bg-green-50 text-green-700 border border-green-100"><span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>Online</span>`
                : `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold bg-gray-50 text-gray-500 border border-gray-100">Offline</span>`;

            return `
                <tr class="hover:bg-slate-50/50 transition-colors">
                    <td class="py-3 px-4">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center shadow-sm flex-shrink-0 bg-gradient-to-tr from-blue-500 to-indigo-600"><i class="fas fa-shield-alt text-white text-xs"></i></div>
                            <span class="font-bold text-slate-800 text-sm truncate">${escapeHtml(u.username)}</span>
                        </div>
                    </td>
                    <td class="py-3 px-4"><span class="text-xs font-mono text-slate-500 bg-slate-50 px-2 py-0.5 rounded border border-slate-100">${escapeHtml(u.password)}</span></td>
                    <td class="py-3 px-4"><span class="text-xs font-mono text-slate-600"><i class="fas fa-network-wired text-slate-400 mr-1.5"></i>${escapeHtml(u.ip_address || 'Dynamic')}</span></td>
                    <td class="py-3 px-4"><span class="text-xs text-slate-600 bg-slate-50 px-2 py-0.5 rounded border border-slate-100">${escapeHtml(u.framed_pool || '—')}</span></td>
                    <td class="py-3 px-4"><span class="text-xs font-mono text-indigo-650 bg-indigo-50/60 px-2 py-0.5 rounded border border-indigo-100/50"><i class="fas fa-tachometer-alt text-indigo-400 mr-1.5"></i>${escapeHtml(u.rate_limit || '—')}</span></td>
                    <td class="py-3 px-4">${statusBadge}</td>
                    <td class="py-3 px-4 text-right">
                        <div class="flex justify-end gap-1.5">
                            <button onclick="openEditModal('${escapeHtml(u.username)}', '${escapeHtml(u.ip_address || '')}', '${escapeHtml(u.framed_pool || '')}', '${escapeHtml(u.rate_limit || '')}')" 
                                    class="w-8 h-8 bg-blue-50 hover:bg-blue-500 text-blue-600 hover:text-white rounded-lg transition-colors flex items-center justify-center shadow-sm" title="Edit User">
                                <i class="fas fa-edit text-xs"></i>
                            </button>
                            <button onclick="deleteUser('${escapeHtml(u.username)}')" 
                                    class="w-8 h-8 bg-rose-50 hover:bg-rose-500 text-rose-600 hover:text-white rounded-lg transition-colors flex items-center justify-center shadow-sm" title="Hapus User">
                                <i class="fas fa-trash text-xs"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');

        const start = (vpnPage - 1) * vpnLimit + 1;
        const end = Math.min(start + data.users.length - 1, vpnTotal);
        updatePagination(start, end, vpnTotal);

    } catch (e) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-10 text-red-500 font-bold"><i class="fas fa-exclamation-triangle mr-2"></i>Error: ${e.message}</td></tr>`;
    }
}

function updatePagination(start, end, total) {
    document.getElementById('vpnStart').textContent = start;
    document.getElementById('vpnEnd').textContent = end;
    document.getElementById('vpnTotal').textContent = total;

    const prevBtn = document.getElementById('vpnPrev');
    const nextBtn = document.getElementById('vpnNext');
    prevBtn.disabled = vpnPage <= 1;
    nextBtn.disabled = end >= total;

    // Render page numbers
    const totalPages = Math.ceil(total / vpnLimit);
    const numsDiv = document.getElementById('vpnPageNums');
    numsDiv.innerHTML = '';
    
    if (totalPages <= 1) return;

    for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= vpnPage - 1 && i <= vpnPage + 1)) {
            const btn = document.createElement('button');
            btn.textContent = i;
            btn.className = `px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${i === vpnPage ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`;
            btn.onclick = () => vpnChangePage(i);
            numsDiv.appendChild(btn);
        } else if (i === 2 || i === totalPages - 1) {
            const span = document.createElement('span');
            span.textContent = '...';
            span.className = 'px-1 py-1.5 text-xs text-gray-400';
            numsDiv.appendChild(span);
        }
    }
}

function vpnChangePage(newPage) {
    vpnPage = newPage;
    loadVpnUsers();
}

function openAddModal() {
    document.getElementById('addForm').reset();
    document.getElementById('addModal').classList.remove('hidden');
}

function closeAddModal() {
    document.getElementById('addModal').classList.add('hidden');
}

async function submitAdd(e) {
    e.preventDefault();
    const form = e.target;
    const body = {
        username: form.username.value,
        password: form.password.value,
        ip_address: form.ip_address.value,
        framed_pool: form.framed_pool.value,
        rate_limit: form.rate_limit.value
    };

    const res = await apiCall('/api/vpn/users/add', {
        method: 'POST',
        body: JSON.stringify(body)
    });

    if (res.success) {
        showNotification(res.message, 'success');
        closeAddModal();
        loadVpnUsers();
    } else {
        showNotification(res.error, 'error');
    }
}

function openEditModal(username, ip, pool, rate) {
    const form = document.getElementById('editForm');
    form.reset();
    form.username.value = username;
    form.ip_address.value = ip;
    form.framed_pool.value = pool;
    form.rate_limit.value = rate;

    document.getElementById('editUserLabel').textContent = username;
    document.getElementById('editModal').classList.remove('hidden');
}

function closeEditModal() {
    document.getElementById('editModal').classList.add('hidden');
}

async function submitEdit(e) {
    e.preventDefault();
    const form = e.target;
    const username = form.username.value;
    const body = {
        ip_address: form.ip_address.value,
        framed_pool: form.framed_pool.value,
        rate_limit: form.rate_limit.value
    };
    if (form.password.value) {
        body.password = form.password.value;
    }

    const res = await apiCall(`/api/vpn/users/update/${username}`, {
        method: 'PUT',
        body: JSON.stringify(body)
    });

    if (res.success) {
        showNotification(res.message, 'success');
        closeEditModal();
        loadVpnUsers();
    } else {
        showNotification(res.error, 'error');
    }
}

async function deleteUser(username) {
    if (!confirm(`Apakah Anda yakin ingin menghapus user VPN "${username}"?`)) return;

    const res = await apiCall(`/api/vpn/users/delete/${username}`, {
        method: 'DELETE'
    });

    if (res.success) {
        showNotification(res.message, 'success');
        loadVpnUsers();
    } else {
        showNotification(res.error, 'error');
    }
}

// Search input handling
document.getElementById('vpnSearch').addEventListener('input', () => {
    clearTimeout(vpnSearchTimeout);
    vpnSearchTimeout = setTimeout(() => {
        vpnPage = 1;
        loadVpnUsers();
    }, 300);
});

// ============================================================
// REAL-TIME VPN TUNNELS MONITORING
// ============================================================
let tunnelRefreshInterval = null;

function formatBytes(bytes) {
    if (!bytes || bytes === 0) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + units[i];
}

function formatRelativeTime(dateStr) {
    if (!dateStr) return '—';
    const now = new Date();
    const then = new Date(dateStr.replace(' ', 'T') + (dateStr.includes('+') || dateStr.includes('Z') ? '' : 'Z'));
    const diffSec = Math.floor((now - then) / 1000);
    if (isNaN(diffSec) || diffSec < 0) return dateStr;
    if (diffSec < 60) return 'Baru saja';
    if (diffSec < 3600) return Math.floor(diffSec / 60) + ' menit lalu';
    if (diffSec < 86400) return Math.floor(diffSec / 3600) + ' jam lalu';
    return Math.floor(diffSec / 86400) + ' hari lalu';
}

async function loadVpnTunnels() {
    const tbody = document.getElementById('tunnelsTableBody');
    try {
        const data = await apiCall('/api/vpn/tunnels');
        const tunnels = data && data.tunnels ? data.tunnels : [];

        // Update count badge
        const countEl = document.getElementById('tunnelCount');
        if (countEl) countEl.textContent = tunnels.length + ' tunnel';

        // Keep statOnline card in sync in real-time
        const statOnlineEl = document.getElementById('statOnline');
        if (statOnlineEl) statOnlineEl.textContent = tunnels.length;

        if (tunnels.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center py-10 text-slate-400">
                <div class="flex flex-col items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center">
                        <i data-lucide="wifi-off" class="lucide w-6 h-6 text-slate-300 dark:text-slate-500"></i>
                    </div>
                    <div>
                        <p class="text-sm font-bold text-slate-500 dark:text-slate-400">Tidak ada tunnel aktif</p>
                        <p class="text-xs text-slate-400 dark:text-slate-500 mt-0.5">Semua koneksi VPN sedang offline</p>
                    </div>
                </div>
            </td></tr>`;
            if (typeof lucide !== 'undefined') lucide.createIcons();
            return;
        }

        tbody.innerHTML = tunnels.map(t => {
            const isOvpn = t.type === 'openvpn';
            const isIkev2 = t.type === 'ikev2';
            const typeBadge = isOvpn
                ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-purple-50 text-purple-700 border border-purple-100 dark:bg-purple-900/30 dark:text-purple-300 dark:border-purple-800/50"><span class="w-1.5 h-1.5 rounded-full bg-purple-500"></span>OpenVPN</span>`
                : isIkev2
                ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-amber-50 text-amber-700 border border-amber-100 dark:bg-amber-900/30 dark:text-amber-300 dark:border-amber-800/50"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>IKEv2</span>`
                : `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-cyan-50 text-cyan-700 border border-cyan-100 dark:bg-cyan-900/30 dark:text-cyan-300 dark:border-cyan-800/50"><span class="w-1.5 h-1.5 rounded-full bg-cyan-500"></span>L2TP</span>`;

            const rxFormatted = formatBytes(t.bytes_recv);
            const txFormatted = formatBytes(t.bytes_sent);
            const connTime = formatRelativeTime(t.connected_since);

            return `
                <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-700/30 transition-colors">
                    <td class="py-3 px-4">${typeBadge}</td>
                    <td class="py-3 px-4">
                        <div class="flex items-center gap-2.5">
                            <div class="w-7 h-7 rounded-lg flex items-center justify-center shadow-sm flex-shrink-0 ${isOvpn ? 'bg-gradient-to-tr from-purple-500 to-indigo-600' : 'bg-gradient-to-tr from-cyan-500 to-teal-600'}">
                                <i class="fas fa-user text-white text-[10px]"></i>
                            </div>
                            <span class="font-bold text-slate-800 dark:text-slate-200 text-sm">${escapeHtml(t.username)}</span>
                        </div>
                    </td>
                    <td class="py-3 px-4"><span class="text-xs font-mono text-slate-500 dark:text-slate-400">${escapeHtml(t.real_address || '—')}</span></td>
                    <td class="py-3 px-4"><span class="text-xs font-mono font-bold text-emerald-600 dark:text-emerald-400">${escapeHtml(t.virtual_address || '—')}</span></td>
                    <td class="py-3 px-4">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-mono text-blue-600 dark:text-blue-400"><i class="fas fa-arrow-down text-[9px] text-blue-400 mr-0.5"></i>${txFormatted}</span>
                            <span class="text-slate-300 dark:text-slate-600">/</span>
                            <span class="text-xs font-mono text-orange-600 dark:text-orange-400"><i class="fas fa-arrow-up text-[9px] text-orange-400 mr-0.5"></i>${rxFormatted}</span>
                        </div>
                    </td>
                    <td class="py-3 px-4"><span class="text-xs text-slate-500 dark:text-slate-400 font-medium">${connTime}</span></td>
                    <td class="py-3 px-4"><span class="text-xs font-mono text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-700 px-2 py-0.5 rounded border border-slate-100 dark:border-slate-600">${escapeHtml(t.cipher || '—')}</span></td>
                </tr>
            `;
        }).join('');

        if (typeof lucide !== 'undefined') lucide.createIcons();

    } catch (e) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-red-500 font-bold text-xs"><i class="fas fa-exclamation-triangle mr-2"></i>Error: ${e.message}</td></tr>`;
    }
}

document.addEventListener('DOMContentLoaded', () => {
    loadVpnUsers();
    loadVpnTunnels();
    // Auto-refresh tunnels every 10 seconds
    tunnelRefreshInterval = setInterval(loadVpnTunnels, 10000);
});
</script>
