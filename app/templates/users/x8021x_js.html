<script>
let x8021xPage = 1;
let x8021xLimit = 20;
let x8021xTotal = 0;
let x8021xSearchTimeout = null;

async function loadx8021xUsers() {
    const searchVal = document.getElementById('x8021xSearch').value;
    const tbody = document.getElementById('x8021xTableBody');
    tbody.innerHTML = `<tr><td colspan="7" class="text-center py-10 text-gray-400"><span class="inline-block w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin mr-2"></span>Loading data...</td></tr>`;

    try {
        const data = await apiCall(`/api/8021x/users?page=${x8021xPage}&limit=${x8021xLimit}&search=${encodeURIComponent(searchVal)}`);
        if (!data || !data.users) throw new Error('Data format error');

        x8021xTotal = data.total;
        
        // Update Stats
        document.getElementById('statTotal').textContent = x8021xTotal;
        
        // Count active sessions in this dataset
        const onlineCount = data.users.reduce((acc, curr) => acc + (curr.active_sessions > 0 ? 1 : 0), 0);
        document.getElementById('statOnline').textContent = onlineCount;

        if (data.users.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center py-10 text-gray-400">Tidak ada user 802.1X ditemukan.</td></tr>`;
            updatePagination(0, 0, 0);
            return;
        }

        tbody.innerHTML = data.users.map(u => {
            const isOnline = u.active_sessions > 0;
            const statusBadge = isOnline 
                ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold bg-green-50 text-green-700 border border-green-100"><span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>Online</span>`
                : `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold bg-gray-50 text-gray-500 border border-gray-100">Offline</span>`;

            return `
                <tr class="hover:bg-slate-50/50 transition-colors">
                    <td class="py-3 px-4">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center shadow-sm flex-shrink-0 bg-gradient-to-tr from-teal-500 to-emerald-600"><i data-lucide="lock" class="w-4 h-4 text-white"></i></div>
                            <span class="font-bold text-slate-800 text-sm truncate">${escapeHtml(u.username)}</span>
                        </div>
                    </td>
                    <td class="py-3 px-4"><span class="text-xs font-mono text-slate-500 bg-slate-50 px-2 py-0.5 rounded border border-slate-100">${escapeHtml(u.password)}</span></td>
                    <td class="py-3 px-4"><span class="text-xs font-mono text-slate-600"><i data-lucide="network" class="w-3.5 h-3.5 text-slate-400 mr-1.5 inline"></i>${escapeHtml(u.ip_address || 'Dynamic')}</span></td>
                    <td class="py-3 px-4"><span class="text-xs text-slate-600 bg-slate-50 px-2 py-0.5 rounded border border-slate-100">${escapeHtml(u.framed_pool || '—')}</span></td>
                    <td class="py-3 px-4"><span class="text-xs font-mono text-indigo-650 bg-indigo-50/60 px-2 py-0.5 rounded border border-indigo-100/50"><i data-lucide="gauge" class="w-3.5 h-3.5 text-indigo-400 mr-1.5 inline"></i>${escapeHtml(u.rate_limit || '—')}</span></td>
                    <td class="py-3 px-4">${statusBadge}</td>
                    <td class="py-3 px-4 text-right">
                        <div class="flex justify-end gap-1.5">
                            <button onclick="openEditModal('${escapeHtml(u.username)}', '${escapeHtml(u.ip_address || '')}', '${escapeHtml(u.framed_pool || '')}', '${escapeHtml(u.rate_limit || '')}')" 
                                    class="w-8 h-8 bg-blue-50 hover:bg-blue-500 text-blue-600 hover:text-white rounded-lg transition-colors flex items-center justify-center shadow-sm" title="Edit User">
                                <i data-lucide="edit" class="w-4 h-4"></i>
                            </button>
                            <button onclick="deleteUser('${escapeHtml(u.username)}')" 
                                    class="w-8 h-8 bg-rose-50 hover:bg-rose-500 text-rose-600 hover:text-white rounded-lg transition-colors flex items-center justify-center shadow-sm" title="Hapus User">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');

        if (typeof lucide !== 'undefined') lucide.createIcons();

        const start = (x8021xPage - 1) * x8021xLimit + 1;
        const end = Math.min(start + data.users.length - 1, x8021xTotal);
        updatePagination(start, end, x8021xTotal);

    } catch (e) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-10 text-red-500 font-bold"><i data-lucide="alert-triangle" class="w-4 h-4 mr-2 inline"></i>Error: ${e.message}</td></tr>`;
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }
}

function updatePagination(start, end, total) {
    document.getElementById('x8021xStart').textContent = start;
    document.getElementById('x8021xEnd').textContent = end;
    document.getElementById('x8021xTotal').textContent = total;

    const prevBtn = document.getElementById('x8021xPrev');
    const nextBtn = document.getElementById('x8021xNext');
    prevBtn.disabled = x8021xPage <= 1;
    nextBtn.disabled = end >= total;

    // Render page numbers
    const totalPages = Math.ceil(total / x8021xLimit);
    const numsDiv = document.getElementById('x8021xPageNums');
    numsDiv.innerHTML = '';
    
    if (totalPages <= 1) return;

    for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= x8021xPage - 1 && i <= x8021xPage + 1)) {
            const btn = document.createElement('button');
            btn.textContent = i;
            btn.className = `px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${i === x8021xPage ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`;
            btn.onclick = () => x8021xChangePage(i);
            numsDiv.appendChild(btn);
        } else if (i === 2 || i === totalPages - 1) {
            const span = document.createElement('span');
            span.textContent = '...';
            span.className = 'px-1 py-1.5 text-xs text-gray-400';
            numsDiv.appendChild(span);
        }
    }
}

function x8021xChangePage(newPage) {
    x8021xPage = newPage;
    loadx8021xUsers();
}

function openAddModal() {
    document.getElementById('addForm').reset();
    document.getElementById('addModal').classList.remove('hidden');
}

function closeAddModal() {
    document.getElementById('addModal').classList.add('hidden');
}

async function submitAdd(e) {
    e.preventDefault();
    const form = e.target;
    const body = {
        username: form.username.value,
        password: form.password.value,
        ip_address: form.ip_address.value,
        framed_pool: form.framed_pool.value,
        rate_limit: form.rate_limit.value
    };

    const res = await apiCall('/api/8021x/users/add', {
        method: 'POST',
        body: JSON.stringify(body)
    });

    if (res.success) {
        showNotification(res.message, 'success');
        closeAddModal();
        loadx8021xUsers();
    } else {
        showNotification(res.error, 'error');
    }
}

function openEditModal(username, ip, pool, rate) {
    const form = document.getElementById('editForm');
    form.reset();
    form.username.value = username;
    form.ip_address.value = ip;
    form.framed_pool.value = pool;
    form.rate_limit.value = rate;

    document.getElementById('editUserLabel').textContent = username;
    document.getElementById('editModal').classList.remove('hidden');
}

function closeEditModal() {
    document.getElementById('editModal').classList.add('hidden');
}

async function submitEdit(e) {
    e.preventDefault();
    const form = e.target;
    const username = form.username.value;
    const body = {
        ip_address: form.ip_address.value,
        framed_pool: form.framed_pool.value,
        rate_limit: form.rate_limit.value
    };
    if (form.password.value) {
        body.password = form.password.value;
    }

    const res = await apiCall(`/api/8021x/users/update/${username}`, {
        method: 'PUT',
        body: JSON.stringify(body)
    });

    if (res.success) {
        showNotification(res.message, 'success');
        closeEditModal();
        loadx8021xUsers();
    } else {
        showNotification(res.error, 'error');
    }
}

async function deleteUser(username) {
    if (!confirm(`Apakah Anda yakin ingin menghapus user 802.1X "${username}"?`)) return;

    const res = await apiCall(`/api/8021x/users/delete/${username}`, {
        method: 'DELETE'
    });

    if (res.success) {
        showNotification(res.message, 'success');
        loadx8021xUsers();
    } else {
        showNotification(res.error, 'error');
    }
}

// Search input handling
document.getElementById('x8021xSearch').addEventListener('input', () => {
    clearTimeout(x8021xSearchTimeout);
    x8021xSearchTimeout = setTimeout(() => {
        x8021xPage = 1;
        loadx8021xUsers();
    }, 300);
});

document.addEventListener('DOMContentLoaded', () => {
    loadx8021xUsers();
});
</script>
